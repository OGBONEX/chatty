services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatty
      POSTGRES_USER: chatty
      POSTGRES_PASSWORD: chatty_dev_only
    ports:
      - "5432:5432"
    volumes:
      - chatty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatty -d chatty"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  chatty-postgres:
